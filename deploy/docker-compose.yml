version: '3.8'

# Pinned so the project keeps its identity now that this file lives under
# deploy/ instead of the repository root. Compose otherwise names the project
# after the containing directory, which would orphan the running containers and
# strand the caddy_data volume holding the issued TLS certificates.
name: hunker-bunker

services:
  backend:
    build:
      # Context stays the repository root: the Dockerfile copies
      # package.json, package-lock.json and server/ from there, and Docker reads
      # .dockerignore from the context root, which is why that file did NOT move.
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hunker-bunker-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HB_STEAM_APPID=4957040
      - HB_DB_BACKEND=${HB_DB_BACKEND:-sqlite}
      - HB_DB_SQLITE_PATH=/app/server/data/hunker_bunker.sqlite
      - HB_DB_STORAGE_PATH=/app/server/data/db_storage.json
      - HB_STEAM_PUBLISHER_KEY=${HB_STEAM_PUBLISHER_KEY}
      - HB_SESSION_SECRET=${HB_SESSION_SECRET}
      - HB_ALLOWED_ORIGINS=${HB_ALLOWED_ORIGINS:-app://-,https://steam.tuesdaycinema.club,http://localhost:3000,http://localhost:5173}
      - HB_STEAM_LEADERBOARD_IDS=${HB_STEAM_LEADERBOARD_IDS}
      - HB_STEAM_STORE_ENABLED=${HB_STEAM_STORE_ENABLED:-0}
      - HB_STEAM_MICROTXN_ENABLED=${HB_STEAM_MICROTXN_ENABLED:-0}
      - HB_STEAM_STORE_MOCK_PURCHASES=0
      - HB_STEAM_DROP_COOLDOWN_SECONDS=60
      # Session-log drop box. Lives under the existing data volume so captures
      # uploaded from a PC or a Steam Deck survive a container rebuild.
      # Set HB_LOG_UPLOAD_TOKEN to require a shared secret; unset means any
      # client that can reach the host may upload.
      - HB_SESSION_LOG_DIR=/app/server/data/session-logs
      - HB_LOG_UPLOAD_TOKEN=${HB_LOG_UPLOAD_TOKEN:-}
    volumes:
      - ../server/data:/app/server/data
    networks:
      - hb-network
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    container_name: hunker-bunker-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hb-network
    depends_on:
      - backend

networks:
  hb-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
