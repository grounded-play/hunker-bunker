# Steam build pipeline (docs/steam-build-pipeline.md, Phase C).
# - Every push to dev/main/mothership branches + PRs: prove the game still packages.
# - Tags (v*) or manual dispatch: build win+linux, then upload to Steam's
#   'beta' branch IF the Steam secrets are configured. Without secrets the
#   upload job skips and the artifacts are still attached to the run.
name: steam-build

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - mothership
      - 'dev/**'
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'main.js'
      - 'index.html'
      - 'style.css'
      - 'package.json'
      - 'vite.config.js'
      - 'scripts/**'
      - 'steam/**'
      - '.github/workflows/steam-build.yml'

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            unpacked: linux-unpacked
          - os: windows-latest
            unpacked: win-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run presubmit
      - run: npm test
      - name: Build revision-stamped web payload
        run: npm run build
        env:
          HB_BUILD_COMMIT: ${{ github.sha }}
          HB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HB_BUILD_DIRTY: "0"
          HB_STEAM_BUILD_ID: gh-${{ github.run_number }}.${{ github.run_attempt }}
          HB_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
      - run: npm run steam:config
        env:
          HB_STEAM_BACKEND_URL: ${{ vars.HB_STEAM_BACKEND_URL }}
          HB_STEAM_APPID: ${{ vars.STEAM_APPID }}
          HB_STEAM_CONFIG_REQUIRE_REMOTE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      - run: npx electron-builder --dir
      - run: npm run audit:retail-assets:package
      - run: npm run steam:audit-depot
      - name: Verify Linux launch payload
        if: runner.os == 'Linux'
        run: |
          test -x dist_electron/linux-unpacked/hunker-bunker
          test -x dist_electron/linux-unpacked/hunker-bunker-bin
      - name: Archive Linux payload with executable modes
        if: runner.os == 'Linux'
        run: tar -C dist_electron -cf hunker-bunker-linux-unpacked.tar linux-unpacked
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: hunker-bunker-linux-unpacked
          path: hunker-bunker-linux-unpacked.tar
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: hunker-bunker-${{ matrix.unpacked }}
          path: dist_electron/${{ matrix.unpacked }}/
          retention-days: 14

  upload-to-steam:
    # Only on tags/dispatch, and only once the builder secrets exist
    # (docs/steam-build-pipeline.md human checklist step 3).
    needs: package
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Steam secrets
        id: creds
        run: |
          if [ -n "${{ secrets.STEAM_BUILD_ACCOUNT }}" ] && [ -n "${{ secrets.STEAM_CONFIG_VDF }}" ] && [ -n "${{ secrets.STEAM_APPID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Steam secrets not configured — skipping upload (artifacts are on the run)."
          fi
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: hunker-bunker-linux-unpacked
          path: dist_electron
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: hunker-bunker-win-unpacked
          path: dist_electron/win-unpacked
      - name: Restore Linux payload and verify launchers
        if: steps.creds.outputs.ready == 'true'
        run: |
          tar -xf dist_electron/hunker-bunker-linux-unpacked.tar -C dist_electron
          test -x dist_electron/linux-unpacked/hunker-bunker
          test -x dist_electron/linux-unpacked/hunker-bunker-bin
          npm run steam:audit-depot
      - name: Upload via steamcmd
        if: steps.creds.outputs.ready == 'true'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_BUILD_ACCOUNT }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APPID }}
          buildDescription: ${{ github.ref_name }}
          rootPath: dist_electron
          firstDepotIdOverride: 4957041
          depot1Path: linux-unpacked
          depot2Path: win-unpacked
          releaseBranch: beta
