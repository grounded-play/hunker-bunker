version: 2

updates:
  # Application, Electron, server, build, and test dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Keep critical, fragile framework versions locked down unless manually audited
    ignore:
      - dependency-name: "electron"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "steamworks.js"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "electron"
          - "steamworks.js"
        update-types:
          - "minor"
          - "patch"

  # Actions referenced by workflows under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Runtime base image declared by deploy/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
