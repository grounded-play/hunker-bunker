<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Game asset URLs are page-relative (Electron file://); resolve them from the root. -->
  <base href="/">
  <title>Anchor practical light probe</title>
  <style>
    html, body { margin: 0; background: #06090b; color: #dfe8e6; font: 14px monospace; }
    .label { position: absolute; padding: 4px 8px; background: #000a; }
  </style>
</head>
<body>
  <!--
    S49 lived-in world M4: the three key-art anchors (oxygen cascade rack,
    liturgical lectern, biomech hatch vent) loaded through the game's own
    createWorld3dModel, in a dim room. Top row: before (room light only).
    Bottom row: after (plus the anchor's pooled practical at 1.45 m).
  -->
  <script type="module">
    import * as THREE from 'three';
    import { createWorld3dModel } from '../../../src/world3dOverlay.js';
    import { anchorLightFor } from '../../../src/anchorPracticalLight.js';

    const anchors = ['prop_oxygen_bottle_cascade_rack', 'prop_liturgical_terminal_lectern', 'prop_biomech_sphincter_hatch_vent'];
    const width = 1280, height = 800;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setScissorTest(true);
    document.body.append(renderer.domElement);

    const models = await Promise.all(anchors.map((type) => createWorld3dModel(type)));

    function panel(type, model, lit) {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06090b);
      // Dim, cool room fill, roughly the gameplay ambient.
      scene.add(new THREE.HemisphereLight(0x6f7f8f, 0x16120e, 0.55));
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x2b3136, roughness: 0.9 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), new THREE.MeshStandardMaterial({ color: 0x353b40, roughness: 0.95 }));
      wall.position.set(0, 2, -1.6);
      scene.add(wall);
      const root = model.clone(true);
      root.scale.multiplyScalar(1.3); // signature placements render at scale 1.3
      scene.add(root);
      const spec = anchorLightFor(type);
      if (lit && spec) {
        const light = new THREE.PointLight(spec.color, spec.intensity, spec.distance, spec.decay);
        light.position.set(0, 1.45, 0);
        scene.add(light);
      }
      const camera = new THREE.PerspectiveCamera(42, (width / 3) / (height / 2), 0.1, 50);
      camera.position.set(2.6, 3.0, 4.2);
      camera.lookAt(0, 0.9, 0);
      return { scene, camera, spec };
    }

    anchors.forEach((type, column) => {
      [false, true].forEach((lit, row) => {
        const { scene, camera, spec } = panel(type, models[column], lit);
        const vx = Math.round(column * width / 3);
        const vy = row === 0 ? height / 2 : 0;
        renderer.setViewport(vx, vy, Math.round(width / 3), height / 2);
        renderer.setScissor(vx, vy, Math.round(width / 3), height / 2);
        renderer.render(scene, camera);
        const label = document.createElement('div');
        label.className = 'label';
        label.style.left = `${vx + 6}px`;
        label.style.top = `${(row === 0 ? 0 : height / 2) + 6}px`;
        label.textContent = `${lit ? 'after' : 'before'} · ${type.replace('prop_', '')}${lit && spec ? ` · ${spec.palette}` : ''}`;
        document.body.append(label);
      });
    });
    window.__anchorLightProbe = { ready: true, loaded: models.map(Boolean) };
  </script>
</body>
</html>
